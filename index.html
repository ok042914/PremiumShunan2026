const CATEGORY_COLORS = {
  '小売業':     { bg: '#E3F2FD', color: '#1565C0' },
  '飲食業':     { bg: '#FFF3E0', color: '#E65100' },
  '建設業':     { bg: '#E8F5E9', color: '#2E7D32' },
  '理美容業':   { bg: '#FCE4EC', color: '#AD1457' },
  'サービス業': { bg: '#F3E5F5', color: '#6A1B9A' },
  '製造業':     { bg: '#EFEBE9', color: '#4E342E' },
  'その他':     { bg: '#F0F2F5', color: '#6B7280' },
};

function esc(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function parseCSV(csv) {
  const lines = csv.trim().split('\n');
  return lines.slice(1).map(line => {
    const parts = line.split('\t');
    const area     = (parts[0] || '').trim();
    const category = (parts[1] || '').trim();
    const name     = (parts[2] || '').trim();
    const branch   = (parts[3] || '').trim();
    const lat      = parseFloat(parts[5]) || null;
    const lng      = parseFloat(parts[6]) || null;
    return { area, category, name, branch, lat, lng };
  }).filter(s => s.name);
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2
    + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

let userLat = null, userLng = null, sortByDistance = false;

function filterShops(shops, keyword, area, category) {
  const kw = keyword.trim().toLowerCase();
  let result = shops.filter(s => {
    if (area     && s.area     !== area)     return false;
    if (category && s.category !== category) return false;
    if (kw) return (s.name + s.branch).toLowerCase().includes(kw);
    return true;
  });

  if (sortByDistance && userLat !== null) {
    result = result.map(s => ({
      ...s,
      dist: (s.lat && s.lng) ? haversine(userLat, userLng, s.lat, s.lng) : Infinity
    })).sort((a, b) => a.dist - b.dist);
  }
  return result;
}

function renderCards(shops) {
  const list = document.getElementById('cardList');
  document.getElementById('countDisplay').textContent = shops.length;

  if (shops.length === 0) {
    list.innerHTML = '<div class="empty">該当するショップが見つかりません</div>';
    return;
  }

  list.innerHTML = shops.map(s => {
    const cat = CATEGORY_COLORS[s.category] || CATEGORY_COLORS['その他'];
    const catBadge  = `<span class="badge" style="background:${cat.bg};color:${cat.color}">${esc(s.category)}</span>`;
    const areaBadge = `<span class="badge badge-area">${esc(s.area)}</span>`;
    const branchHtml = s.branch ? ` <span class="card-branch">${esc(s.branch)}</span>` : '';
    let distHtml = '';
    if (sortByDistance && s.dist != null && s.dist !== Infinity) {
      const d = s.dist < 1 ? Math.round(s.dist * 1000) + 'm' : s.dist.toFixed(1) + 'km';
      distHtml = `<span class="badge badge-dist">${d}</span>`;
    }
    return `<div class="card">
  <div class="card-name">${esc(s.name)}${branchHtml}</div>
  <div class="card-badges">${distHtml}${areaBadge}${catBadge}</div>
</div>`;
  }).join('');
}

const shops = parseCSV(CSV_DATA);

function populateSelect(id, key) {
  const sel = document.getElementById(id);
  const values = [...new Set(shops.map(s => s[key]))];
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    sel.appendChild(opt);
  });
}
populateSelect('areaFilter', 'area');
populateSelect('categoryFilter', 'category');

document.getElementById('totalDisplay').textContent = '（全 ' + shops.length + ' 件）';

function update() {
  const keyword  = document.getElementById('keyword').value;
  const area     = document.getElementById('areaFilter').value;
  const category = document.getElementById('categoryFilter').value;
  renderCards(filterShops(shops, keyword, area, category));
}

document.getElementById('keyword').addEventListener('input', update);
document.getElementById('areaFilter').addEventListener('change', update);
document.getElementById('categoryFilter').addEventListener('change', update);

const nearBtn = document.getElementById('nearBtn');
nearBtn.addEventListener('click', () => {
  if (sortByDistance) {
    sortByDistance = false;
    userLat = null;
    userLng = null;
    nearBtn.classList.remove('active');
    nearBtn.textContent = '現在地から近い順に表示';
    update();
    return;
  }
  if (!navigator.geolocation) {
    alert('この端末では現在地の取得ができません');
    return;
  }
  nearBtn.textContent = '現在地を取得中...';
  nearBtn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      sortByDistance = true;
      nearBtn.classList.add('active');
      nearBtn.textContent = '現在地から近い順（解除）';
      nearBtn.disabled = false;
      update();
    },
    () => {
      nearBtn.textContent = '現在地から近い順に表示';
      nearBtn.disabled = false;
      alert('現在地の取得に失敗しました');
    },
    { timeout: 10000 }
  );
});

update();

function setStickyOffsets() {
  const header     = document.querySelector('header');
  const pdfBar     = document.querySelector('.pdf-link-bar');
  const searchArea = document.querySelector('.search-area');
  const summaryBar = document.querySelector('.summary-bar');
  const h0 = header.offsetHeight;
  const h1 = pdfBar.offsetHeight;
  const h2 = searchArea.offsetHeight;
  pdfBar.style.top     = h0 + 'px';
  searchArea.style.top = (h0 + h1) + 'px';
  summaryBar.style.top = (h0 + h1 + h2) + 'px';
}
setStickyOffsets();
window.addEventListener('resize', setStickyOffsets);
</script>
</body>
</html>
